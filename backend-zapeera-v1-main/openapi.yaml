openapi: 3.0.3
info:
  title: Zapeera API
  description: |
    Multi-business SaaS Management Platform API
    
    Supports multiple business types including:
    - Pharmacies
    - Restaurants
    - Clothing Stores
    - Departmental Stores
    - Clinics
    
    ## Authentication
    All API requests require a JWT token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Multi-Tenancy Headers
    Business-scoped requests require context headers:
    ```
    X-Company-ID: <business-id>
    X-Branch-ID: <branch-id> (optional)
    ```
  version: 1.0.0
  contact:
    name: Zapeera Support
    email: support@zapeera.com

servers:
  - url: http://localhost:4200/api
    description: Local development server
  - url: https://api.zapeera.com/api
    description: Production server

tags:
  - name: Authentication
    description: User login, registration, and password management
  - name: Business
    description: Multi-tenancy business management
  - name: Users
    description: User and membership management
  - name: Products
    description: Product and inventory management
  - name: POS
    description: Point of sale operations
  - name: Reports
    description: Analytics and reporting
  - name: Subscriptions
    description: SaaS subscription and billing
  - name: Modules
    description: Feature module management
  - name: Backoffice
    description: Platform admin operations

paths:
  # Authentication
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Invalid credentials

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, email, password]
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User created successfully
        400:
          description: Validation error

  # Business Management
  /companies/my/list:
    get:
      tags: [Business]
      summary: Get user's businesses
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of businesses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'

  /companies:
    post:
      tags: [Business]
      summary: Create new business
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, businessType]
              properties:
                name:
                  type: string
                businessType:
                  type: string
                  enum: [PHARMACY, RESTAURANT, CLOTHING, DEPARTMENTAL, CLINIC]
                address:
                  type: string
                phone:
                  type: string
      responses:
        201:
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'

  # Products
  /products:
    get:
      tags: [Products]
      summary: List products
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

    post:
      tags: [Products]
      summary: Create product
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        201:
          description: Product created

  # POS
  /sales:
    post:
      tags: [POS]
      summary: Create sale transaction
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        201:
          description: Sale created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'

  # Modules
  /modules/enabled:
    get:
      tags: [Modules]
      summary: Get enabled modules for business
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Enabled modules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hierarchy:
                        type: array
                        items:
                          $ref: '#/components/schemas/Module'
                      userRole:
                        type: string

  /modules/hierarchy:
    get:
      tags: [Modules]
      summary: Get full module hierarchy
      security:
        - bearerAuth: []
      responses:
        200:
          description: Module hierarchy

  # Subscriptions
  /subscription/current:
    get:
      tags: [Subscriptions]
      summary: Get current subscription
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscription/plans:
    get:
      tags: [Subscriptions]
      summary: List available plans
      security:
        - bearerAuth: []
      responses:
        200:
          description: Available plans

  # Reports
  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
      responses:
        200:
          description: Dashboard stats

  /reports/sales:
    get:
      tags: [Reports]
      summary: Get sales report
      security:
        - bearerAuth: []
      parameters:
        - name: X-Company-ID
          in: header
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        200:
          description: Sales report data

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        membership:
          $ref: '#/components/schemas/Membership'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'

    Membership:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        roleId:
          type: string
        roleName:
          type: string
          enum: [OWNER, MANAGER, CASHIER]
        branchIds:
          type: array
          items:
            type: string
        status:
          type: string

    Business:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        businessType:
          type: string
        address:
          type: string
        phone:
          type: string
        isOwned:
          type: boolean
        subscription:
          $ref: '#/components/schemas/Subscription'

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        quantity:
          type: integer
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        quantity:
          type: integer
        categoryId:
          type: string

    Sale:
      type: object
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        total:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'
        customer:
          $ref: '#/components/schemas/Customer'
        createdAt:
          type: string
          format: date-time

    SaleInput:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItemInput'
        total:
          type: number
        customerId:
          type: string
        discount:
          type: number

    SaleItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        price:
          type: number
        total:
          type: number

    SaleItemInput:
      type: object
      required: [productId, quantity, price]
      properties:
        productId:
          type: string
        quantity:
          type: integer
        price:
          type: number

    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string

    Module:
      type: object
      properties:
        module:
          type: string
        displayName:
          type: string
        icon:
          type: string
        subModules:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              name:
                type: string
              path:
                type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum: [active, trial, expired, cancelled]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        features:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
