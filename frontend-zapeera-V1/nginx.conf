# Frontend SPA + same-origin API proxy (single-host stack, 2026-10-15).
# The backend service was renamed zapeera-backend -> backend to match the
# repo-root docker-compose.yml service names. Behaviour is otherwise the
# repo's original pattern: /api/ and /health proxy to the backend, and the
# SPA falls back to /index.html. Two additions for the single-host stack:
#  - SSE: proxy_buffering off + long read timeout on /api/ so
#    GET /api/.../events streams instead of buffering (the failure mode the
#    old Vercel rewrite caused).
#  - /uploads/: user uploads (payment proofs) are stored and served by the
#    backend; proxy them so same-origin page references resolve.
server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:4200/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE / realtime streaming
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
  }

  # Exact match only: a prefix /health location also captured the
  # static /health.html page from public/ and proxied it to a 404.
  location = /health {
    proxy_pass http://backend:4200/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:4200/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets: serve the real file or a REAL 404 — never the
  # SPA fallback. A tab opened before a redeploy requests old chunk
  # hashes; answering with index.html makes the browser parse HTML as a
  # JS module and die with "Failed to fetch dynamically imported
  # module". A clean 404 lets the app's preloadError recovery reload
  # into the fresh build instead.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
