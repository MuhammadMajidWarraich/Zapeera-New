name: CI Backend + Frontend validation

on:
  push:
    branches: [master]
    paths:
      - 'backend-zapeera-v1-main/**'
  workflow_dispatch:

jobs:
  backend-validate:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-zapeera-v1-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-zapeera-v1-main/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Schema parity check
        run: node scripts/check-schema-sync.js

      - name: Backend test suite (deterministic SQLite test mode)
        run: npm test

      - name: Confirm Prisma provider is restored after tests
        # The test runner restores the previously generated provider. In CI
        # nothing was generated before, so the SQLite test client must remain.
        run: node scripts/check-generated-provider.js sqlite

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Route-policy / authorization tests
        run: node scripts/run-tests.js --testPathPattern="(route-inventory|module-route-protection|module-page-permissions)"

      - name: Dependency security audit
        # Strict gate — the backend has zero high/critical advisories.
        run: npm audit --audit-level=high

  frontend-validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-zapeera-V1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-zapeera-V1/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run build:typecheck

      - name: Lint (baseline gate — no new issues)
        run: npm run lint:gate

      - name: Production build
        run: npm run build:prod

      - name: Dependency security audit
        # Baseline gate: fails on NEW high/critical advisories. The allowlist
        # covers the desktop/build toolchain (electron, electron-builder/tar,
        # vite) whose fixes are blind major bumps the CI cannot validate.
        run: node scripts/check-audit-baseline.js

  deploy:
    name: Deploy to Railway
    needs: [backend-validate, frontend-validate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-zapeera-v1-main
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-zapeera-v1-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (validated — no forced flags)
        run: npm run build:prod

      - name: Deploy to Railway
        # Official Railway CLI deploy. Runs from backend-zapeera-v1-main
        # so `railway up` uploads the backend root (Railway builds it).
        # Skipped (with a notice) when the Railway secrets are not configured.
        if: env.RAILWAY_TOKEN != ''
        run: npx --yes @railway/cli@latest up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "${{ secrets.RAILWAY_ENVIRONMENT || 'production' }}" -m "deploy ${{ github.sha }}"

      - name: Railway deploy not configured
        if: env.RAILWAY_TOKEN == ''
        run: echo "::warning::Railway deploy SKIPPED — add RAILWAY_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID (and optional RAILWAY_ENVIRONMENT) repository secrets to enable automatic deploys."
