name: CI Backend + Frontend validation

on:
  push:
    branches: [master]
    paths:
      - 'backend-zapeera-v1-main/**'
      - 'frontend-zapeera-V1/**'
      # Single-host deployment surface (Docker Compose stack) — changes here
      # previously triggered NO CI at all.
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'ocr-service/**'
      - '.github/workflows/ci-validate.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend-zapeera-v1-main/**'
      - 'frontend-zapeera-V1/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'ocr-service/**'
      - '.github/workflows/ci-validate.yml'
  workflow_dispatch:

jobs:
  backend-validate:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-zapeera-v1-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-zapeera-v1-main/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Schema parity check
        run: node scripts/check-schema-sync.js

      - name: Backend test suite (deterministic SQLite test mode)
        run: npm test

      - name: Confirm Prisma provider is restored after tests
        # The test runner restores the previously generated provider. In CI
        # nothing was generated before, so the SQLite test client must remain.
        run: node scripts/check-generated-provider.js sqlite

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Route-policy / authorization tests
        run: node scripts/run-tests.js --testPathPattern="(route-inventory|module-route-protection|module-page-permissions)"

      - name: Dependency security audit
        # Strict gate — the backend has zero high/critical advisories.
        run: npm audit --audit-level=high

  frontend-validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-zapeera-V1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-zapeera-V1/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run build:typecheck

      - name: Lint (baseline gate — no new issues)
        run: npm run lint:gate

      - name: Production build
        run: npm run build:prod

      - name: Dependency security audit
        # Baseline gate: fails on NEW high/critical advisories. The allowlist
        # covers the desktop/build toolchain (electron, electron-builder/tar,
        # vite) whose fixes are blind major bumps the CI cannot validate.
        run: node scripts/check-audit-baseline.js

  deploy-surface:
    name: Deployment surface (compose + Caddy + OCR image)
    # Replaces the old Railway deploy job: the project no longer deploys to
    # Railway — production is the single-host Docker Compose stack
    # (docker-compose.yml + Caddyfile + ocr-service) on Oracle Cloud.
    # This job smoke-validates that deployment surface on every change to it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        # env_file (.env) must exist for `docker compose config`; the
        # committed template provides safe placeholder values.
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate Caddyfile
        # Site addresses are env-driven ({$FRONTEND_DOMAIN} / {$API_DOMAIN});
        # validate with placeholder domains.
        run: |
          docker run --rm \
            -e FRONTEND_DOMAIN=example.com \
            -e API_DOMAIN=api.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: OCR service image smoke build
        run: docker build -t zapeera-ocr-ci ./ocr-service
