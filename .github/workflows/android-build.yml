name: Android Build (debug APK)

on:
  workflow_dispatch:
  push:
    branches: [migration/oracle-single-host]
    paths:
      - '.github/workflows/android-build.yml'
      - 'frontend-zapeera-V1/capacitor.config.ts'
      - 'frontend-zapeera-V1/.env.mobile'
      - 'frontend-zapeera-V1/android/**'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-zapeera-V1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-zapeera-V1/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (manual cmdline-tools)
        working-directory: ${{ github.workspace }}
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (mobile mode)
        run: npx cross-env VITE_CJS_IGNORE_WARNING=1 vite build --mode mobile

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend-zapeera-V1/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish APK as release asset
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp frontend-zapeera-V1/android/app/build/outputs/apk/debug/app-debug.apk Zapeera-Android-0.2.1-debug.apk
          gh release create android-v0.2.1 Zapeera-Android-0.2.1-debug.apk \
            --title "Zapeera Android v0.2.1 (debug)" \
            --notes "Android build of the Zapeera app (Capacitor, appId com.seikho.zapeera), talking to the cloud API at api.zapeera.seikho.online. Carries the October 2026 maturity wave: prescriptions, clinic and hotel modules, promotions/tax/FBR POS, backup & restore, affiliate and white-label support. Debug build for testing — sideload the APK to install." \
            --prerelease
