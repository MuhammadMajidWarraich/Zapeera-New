name: Android Build (debug APK)

on:
  workflow_dispatch:
  push:
    branches: [migration/oracle-single-host]
    paths:
      - '.github/workflows/android-build.yml'
      - 'frontend-zapeera-V1/capacitor.config.ts'
      - 'frontend-zapeera-V1/.env.mobile'
      - 'frontend-zapeera-V1/android/**'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-zapeera-V1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-zapeera-V1/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (mobile mode)
        run: npx cross-env VITE_CJS_IGNORE_WARNING=1 vite build --mode mobile

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend-zapeera-V1/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish APK as release asset
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp frontend-zapeera-V1/android/app/build/outputs/apk/debug/app-debug.apk Zapeera-Android-0.1.0-debug.apk
          gh release create android-v0.1.0 Zapeera-Android-0.1.0-debug.apk \
            --title "Zapeera Android v0.1.0 (debug)" \
            --notes "First Android build of the Zapeera app (Capacitor, appId com.seikho.zapeera), talking to the cloud API at api.zapeera.seikho.online. Debug build for testing — sideload the APK to install." \
            --prerelease
